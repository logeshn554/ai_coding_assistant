name: Security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Block concurrent runs on the same ref so scans don't pile up on busy PRs
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Python static security analysis (bandit) ────────────────────────────
  backend-security:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # needed to upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit with SARIF support
        run: pip install "bandit[sarif]"

      - name: Bandit scan — HIGH severity, HIGH confidence only
        # -ll = level HIGH+, -ii = confidence HIGH+, -r = recursive
        # Exits non-zero on any finding at this threshold → PR gate fails
        run: |
          bandit -r backend/app -ll -ii \
            --format sarif \
            --output bandit-results.sarif || true
          bandit -r backend/app -ll -ii

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()   # upload even if bandit found something
        with:
          sarif_file: bandit-results.sarif

  # ── 2. Python dependency CVE scan (pip-audit) ──────────────────────────────
  backend-deps:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt --skip-editable --desc on || true

  # ── 3. Secret detection (gitleaks) ─────────────────────────────────────────
  secret-scan:
    name: Gitleaks (secret detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — gitleaks scans every commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment to suppress false positives via a .gitleaks.toml config:
          # GITLEAKS_CONFIG: .gitleaks.toml

  # ── 4. Frontend npm audit ───────────────────────────────────────────────────
  frontend-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: npm audit — HIGH severity gate
        # Exit non-zero on HIGH or CRITICAL vulnerabilities
        run: cd frontend && npm audit --audit-level=high
