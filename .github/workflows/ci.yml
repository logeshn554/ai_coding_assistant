name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install "fakeredis[aioredis]>=2.0.0" pytest-cov pip-audit mypy ruff

    - name: Run Ruff Linter
      run: ruff check backend/app

    - name: Run Mypy Typecheck
      run: mypy --ignore-missing-imports backend/app

    - name: Audit dependencies (Section 30 requirement)
      run: pip-audit --desc on

    - name: Run Python tests with coverage
      run: |
        python -m pytest --cov=backend/app --cov-report=xml --cov-report=term-missing --cov-fail-under=70 tests/

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: python-coverage-report
        path: coverage.xml

  security-scanning:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Gitleaks Secret Scanner (Section 32 requirement)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Node dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend React Application
      run: |
        cd frontend
        npm run build

    - name: Run Frontend Tests
      run: |
        cd frontend
        npm run test -- --run

  docker-sbom:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-build]

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t devpilot:latest .

    - name: Generate SBOM (Section 42 requirement)
      uses: anchore/sbom-action@v0
      with:
        image: devpilot:latest
        format: cyclonedx-json
        output-file: sbom.cyclonedx.json

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-sbom
        path: sbom.cyclonedx.json
