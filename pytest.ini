[pytest]
asyncio_mode = auto
python_files = test_*.py *_test.py
norecursedirs = frontend node_backend venv node_modules .git
addopts = --ignore=frontend/test_results.txt --ignore=frontend/test_out.txt --ignore=frontend/test_run.txt --ignore=test.txt --ignore=test_temp.txt --ignore=testfile_from_agent.txt
